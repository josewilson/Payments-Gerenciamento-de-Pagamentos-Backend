spring:
  application:
    name: payments

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:paymentsdb}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    baseline-on-migrate: true
    baseline-version: 0

  cache:
    cache-names: cotacoes
    caffeine:
      spec: expireAfterWrite=10m,maximumSize=200

  mongodb:
    uri: ${MONGO_URI:mongodb://localhost:27017/payments_audit_db}

  data:
    web:
      pageable:
        max-page-size: 100

security:
  jwt:
    secret: ${JWT_SECRET}

server:
  port: 8080
  shutdown: graceful

exchange-rate:
  base-url: ${EXCHANGE_RATE_URL:https://open.er-api.com/v6}
  connect-timeout: 2s
  read-timeout: 3s

resilience4j:
  retry:
    instances:
      exchangeRate:
        max-attempts: 3
        wait-duration: 200ms
        retry-exceptions:
          - com.josewilson.payments.exception.CotacaoIndisponivelException
  circuitbreaker:
    instances:
      exchangeRate:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        record-exceptions:
          - com.josewilson.payments.exception.CotacaoIndisponivelException

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
