spring:
  application:
    name: payments

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:paymentsdb}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    baseline-on-migrate: true
    baseline-version: 0

  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/payments_audit_db}
    web:
      pageable:
        max-page-size: 100

server:
  port: 8080
  shutdown: graceful

exchange-rate:
  base-url: ${EXCHANGE_RATE_URL:https://open.er-api.com/v6}
  connect-timeout: 2s
  read-timeout: 3s
